# XAUUSD OF — configuration centrale.
# Règle : changer UNE option à la fois et la valider au walk-forward.

symbols:
  broker: XAUUSD          # nom exact du symbole chez le broker MT5 (vérifié FTMO)
  futures: GC.v.0         # Databento : contrat GC continu, roulé sur le volume
  dataset: GLBX.MDP3      # CME Globex

data:
  dir: data               # stockage local Parquet (ignoré par git)
  schema: trades          # transactions avec côté agresseur
  max_cost_usd: 10        # plafond Databento par lancement (refus si dépassé)
  # journées signalées « degraded » par Databento. INFORMATIF : le moteur ne s'en
  # sert pas (information connue après coup) ; à utiliser seulement pour l'analyse.
  exclude_days: [2025-11-28, 2026-01-31, 2026-03-15, 2026-03-16, 2026-03-21,
                 2026-04-10, 2026-05-24, 2026-08-29]

broker:
  # heure serveur MT5 FTMO = New York + 7 h (UTC+2 l'hiver, UTC+3 pendant l'heure
  # d'été AMÉRICAINE). Vérifié par corrélation GC / XAUUSD : « Europe/Athens » était
  # décalé d'1 h entre les changements d'heure US et européens.
  server_clock: America/New_York+7
  point: 0.01                     # 1 point XAUUSD = 0,01 $ (le spread MT5 est en points)

bridge:                   # report des niveaux GC sur le prix XAUUSD du broker
  window: 60min           # médiane glissante du basis
  min_obs: 20
  max_noise: 1.0          # $ : au-delà, on ne se fie plus au report

sessions:                 # heures de New York
  timezone: America/New_York
  rth: ["08:20", "13:30"] # séance régulière COMEX, là où le volume se concentre
  tpo_period_min: 30
  initial_balance_min: 60

profile:
  value_area_pct: 0.70
  tick_size: 0.10         # pas de prix GC
  bin_size: 0.50          # regroupement des niveaux (volume profile, TPO)
  hvn_smooth: 5           # lissage (en niveaux) avant détection HVN / LVN
  lvn_ratio: 0.5          # LVN < 50 % du plus petit des deux HVN voisins

orderflow:
  bar: 5min
  footprint_bin: 0.50
  imbalance_ratio: 3.0
  imbalance_min_volume: 10
  absorption:
    lookback: 20
    vol_mult: 1.5
    delta_frac: 0.15
    max_move_atr: 0.3

smc:
  fvg_min_size: 0.5       # $ : ignore les micro-FVG
  ob_displacement_atr: 1.5

# ---------------------------------------------------------------------------
# PHASE 4 — stratégie. Toutes ces valeurs sont des HYPOTHÈSES INITIALES à
# tester, pas des paramètres optimisés. Ne pas les régler sur la période
# réservée (validation.holdout_start).
# ---------------------------------------------------------------------------

account:
  initial_capital: 10000          # USD — FTMO CFD 2-Step 10k
  currency: USD

risk:
  risk_per_trade_pct: 0.5         # % de min(equity, capital initial), frais estimés compris
  max_positions: 1
  max_entries_per_day: 3          # entrées exécutées par journée de trading
  daily_stop_usd: 150             # arrêt interne : réalisé + flottant + frais, vs solde à minuit Prague
  daily_reset_timezone: Europe/Prague
  total_floor_margin_usd: 200     # marge interne au-dessus du plancher FTMO (9 000 → arrêt à 9 200)
  spread_filter_mult: 2.0         # bloque si spread > 2 × médiane des 60 dernières minutes
  spread_filter_window_min: 60
  spread_filter_min_obs: 60       # historique insuffisant = pas d'entrée

ftmo:                             # profil FTMO 2-Step (à vérifier dans les conditions du compte)
  # Source : pages « Trading Objectives » FTMO + synthèses 2026 (propfirmexperts.com,
  # stonkjournal.com). À confirmer dans le contrat et le Client Area du compte.
  daily_loss_limit_usd: 500       # 5 % du capital initial, vs solde à minuit CE(S)T
  max_loss_usd: 1000              # 10 % : plancher d'equity 9 000 USD
  reset_timezone: Europe/Prague

costs:
  # Coûts ESTIMÉS. Commission FTMO métaux non vérifiée : ouvrir 0,01 lot en démo et
  # lire la commission dans l'historique MT5, puis corriger ici.
  commission_per_lot_round_trip: 6.0   # USD par lot aller-retour (hypothèse prudente)
  slippage_price: 0.10                  # $ par once, appliqué aux ordres au marché et aux stops

instrument:                       # XAUUSD — remplacé par data/xauusd/spec.json si présent
  # (créé par : python -m xauof.data.symbol_spec, MT5 ouvert)
  contract_size: 100              # onces par lot
  tick_size: 0.01
  tick_value: 1.0                 # USD par tick et par lot
  volume_min: 0.01
  volume_step: 0.01
  volume_max: 100
  profit_currency: USD

strategy:
  timezone: America/New_York
  entry_start: "08:20"            # entrées autorisées (heure d'exécution)
  entry_end: "13:15"
  flat_time: "13:30"              # clôture des positions et annulation des ordres
  london_enabled: false           # réservé ; non implémenté en V1
  warmup_start: "04:00"           # historique pré-séance pour ATR, pivots, spread, volumes
  zone_tf: 5min
  atr_period: 14
  fvg_min_spreads: 2              # taille min FVG = max(2 spreads, 0.1 ATR)
  fvg_min_atr: 0.1
  fvg_max_atr: 1.0
  pivot_left: 2
  pivot_right: 2
  ob_body_atr: 1.0                # corps de la bougie de cassure >= 1 ATR (ATR avant la bougie)
  ob_lookback: 5                  # recherche de la dernière bougie opposée
  # « proche » : distance niveau ↔ zone (score ET retest de la borne cassée).
  # 0.15 → 0.5 le 2026-10-23, décidé sur l'entonnoir in-sample (441 contacts refusés
  # « zone loin de la borne », 0.15 ATR ≈ 0,30-0,50 $), PAS sur le PnL.
  near_atr: 0.5
  min_score_families: 1           # variantes B et C (2 → 1 le 2026-10-23 : 2 familles bloquaient ~90 % des contacts)
  sl_margin_atr: 0.1              # marge SL = max(spread, 0.1 ATR)
  min_rr_net: 1.5
  value_area_source: volume       # VA utilisée par les scénarios : volume | tpo
  value_return:
    reentry_within_m5: 3          # clôture de retour dans les 3 bougies M5 suivantes
    setup_valid_m5: 12            # durée de vie du setup après le retour : 60 min (30 → 60 le 2026-10-23)
  breakout:
    volume_pairs: 20              # médiane des volumes cumulés des 20 paires précédentes
    # objectif : mouvement mesuré = borne cassée ± hauteur de la VA précédente, sauf
    # obstacle connu plus proche (ajouté le 2026-10-23 : sans lui, aucun objectif
    # n'existait dans le sens d'une cassure)
    # false (2026-10-23) : toute zone fraîche dans le sens de la cassure est un repli
    # tradable (continuation) ; true : seulement le retest de la borne cassée.
    require_bound_retest: false
  trigger:
    max_m1_bars: 3                # délai de confirmation après le contact
    absorption_enabled: false     # variante séparée, désactivée par défaut
  v2:                             # STRATEGY_V2.md (figée le 2026-10-23)
    target_r: 2.0                 # objectif fixe en R (distance entrée → SL)
    partial_r: 1.0                # sortie partielle à +1 R...
    partial_fraction: 0.5         # ... de 50 % de la position (arrondi vers le bas)
    breakeven_after_partial: true # stop du reste ramené au prix d'entrée
    space_filter_r: 1.0           # variantes *F : refus si un niveau de la veille est avant +1 R
  data_guards:
    max_gc_staleness_min: 2       # dernière bougie GC trop ancienne → pas d'entrée
    max_unclassified_share: 0.05  # part du volume GC sans côté agresseur tolérée (delta)
    hvn_zone_frac: 0.7            # une HVN = niveaux autour du pic >= 70 % du pic

news:
  # Protections INTERNES (distinctes des règles contractuelles FTMO, qui dépendent
  # du programme et de la phase : ex. compte financé Standard = ±2 min).
  # historique officiel versionné (backtests) + imports live Forex Factory (local)
  calendar_dirs: [calendar/history, data/calendar]
  live_dir: data/calendar
  blackout_before_min: 15
  blackout_after_min: 15
  flatten_before_min: 15
  flatten_kinds: [NFP, CPI, FOMC]
  currencies: [USD]
  # block : aucun trade un jour sans calendrier (défaut, obligatoire en live et pour
  #         tout résultat qui compte). L'historique calendar/history couvre
  #         oct. 2024 → sept. 2026 (NFP, CPI, PPI, JOLTS, PIB, PCE, FOMC).
  # ignore_backtest_only : backtest SANS filtre news, rapport marqué non représentatif.
  missing_calendar: block

validation:
  holdout_start: 2026-07-01       # période réservée hors échantillon : ne pas régler dessus
